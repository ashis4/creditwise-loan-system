<div style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: linear-gradient(90deg, #1f2937, #111827);
    padding: 12px 25px;
    border-radius: 10px;
    font-family: 'Segoe UI', sans-serif;
">

    <!-- LEFT: Title + Toggle -->
    <div style="display:flex; align-items:center; gap:12px; color:white;">
        <h2 style="margin:0; font-size:22px;">💼 CreditWise</h2>

        <!-- Toggle Switch -->
        <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label>
    </div>

    <!-- RIGHT: Navigation -->
    <div style="display:flex; gap:25px; align-items:center;">

        <a href="#" style="
            color:#d1d5db;

            font-size:15px;
        ">Home</a>

        <a href="#" style="

        ">Contact</a>

    </div>

</div>

<!-- TOGGLE CSS -->
<style>
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 20px;
}

.switch input {
  display: none;
}

.slider {
  position: absolute;
  cursor: pointer;
  background-color: #6b7280;
  border-radius: 20px;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  transition: 0.4s;
}

.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  border-radius: 50%;
  transition: 0.4s;
}

input:checked + .slider {
  background-color: #60a5fa;
}

input:checked + .slider:before {
  transform: translateX(20px);
}
</style>
